"l4d_tank_timer_spawn"
{
	// If cvar not set in "1"~"31" selection, the plugin will use "default" (Global) selection
	// 如果參數沒有在 "1"~"31" 區段找到, 則會使用 "default" 區段內預設的參數

	// Global settings
	// 預設設置
	"default"
	{
		// Set max interval time to spawn tank
		// 生成tank的時間間隔 (最長時間)
		"interval_max"      "120.0"

		// Set min interval time to spawn tank
		// 生成tank的時間間隔 (最短時間)
		"interval_min"      "60.0"

		// Set total max numbers of Tanks to spawn each time
		// 每次生成tank的數量 (最多)
		"number_max"        "2"

		// Set total min numbers of Tanks to spawn each time
		// 每次生成tank的數量 (最少)
		"number_min"        "0"

		// Max tank limit on the filed (If limit reached, don't spawn tanks)
		// 場上的Tank數量上限 (已達數量時不會繼續生成tank)
		"max_limit"         "4"

		// When to start the timer to spawn tank 
		// 1=After a survivor leaves the saferoom and before final starts
		// 2=After final starts
		// 3=After a survivor leaves the saferoom + after final starts
		// -
		// 何時開始生成Tank
		// 1=倖存者離開安全區後+救援開始之前
		// 2=救援開始之後
		// 3=倖存者離開安全區後+救援開始之後
		"when"              "3"

		// If 1, display chat message
		// 為1時，聊天框顯示Tank數量與時間提示
		"notify"            "1"
	}
	
	// When there are only 1 alive survivor in server
	// 當伺服器只有一名活著倖存者時，讀取以下設置
	"1"
	{
		"interval_max"      "120.0"
		"interval_min"      "60.0"
		"number_max"        "2"
		"number_min"        "0"
		"max_limit"         "4"
	}
	
	// When there are only 2 alive survivors in server
	// 當伺服器只有兩名活著倖存者時，讀取以下設置
	"2"
	{
		"interval_max"      "120.0"
		"interval_min"      "60.0"
		"number_max"        "2"
		"number_min"        "0"
		"max_limit"         "4"
	}
	
